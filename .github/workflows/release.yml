name: Release

# Packs Tern.Cli as RID-specific Native AOT tools and pushes them to nuget.org.
# Native AOT can't cross-compile between operating systems, so each RID package is built on a
# matching runner; the top-level package only points at them, so it is packed once.
#
# Pushing a v* tag publishes to nuget.org and creates the GitHub Release, with a standalone binary
# for each RID. A manual run packs and verifies, and publishes or makes the release only when asked.
# nuget.org accepts the push through Trusted Publishing: the job trades its GitHub OIDC token for
# a short-lived API key, so no NuGet key is stored in the repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Push the packages to nuget.org
        type: boolean
        default: false
      github-release:
        description: Create the GitHub Release for the version's existing tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The version lives in Directory.Build.props; a tag only says which commit ships it.
      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          [ -n "$version" ] || { echo "::error::No <Version> in Directory.Build.props"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Directory.Build.props"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  pack-rid:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack Tern.Cli (${{ matrix.rid }})
        run: dotnet pack src/Tern.Cli -c Release -r ${{ matrix.rid }} -o artifacts/nupkg

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg-${{ matrix.rid }}
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error

      # The standalone binary for the GitHub Release: just the executable, without debug symbols.
      - name: Publish the standalone binary (${{ matrix.rid }})
        run: dotnet publish src/Tern.Cli -c Release -r ${{ matrix.rid }} -o artifacts/bin

      - name: Archive the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Compress-Archive -Path artifacts/bin/tern.exe -DestinationPath "artifacts/release/tern-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Archive the binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts/release
          tar -czf "artifacts/release/tern-${{ needs.version.outputs.version }}-${{ matrix.rid }}.tar.gz" -C artifacts/bin tern

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  pack:
    needs: [version, pack-rid]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack the top-level package
        run: dotnet pack src/Tern.Cli -c Release -o artifacts/nupkg

      - uses: actions/download-artifact@v8
        with:
          pattern: nupkg-*
          path: artifacts/nupkg
          merge-multiple: true

      # The top-level package and all six RID packages, at the version being released.
      - name: Check the package set
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          missing=0
          for suffix in "" .win-x64 .win-arm64 .linux-x64 .linux-arm64 .osx-x64 .osx-arm64; do
            f="artifacts/nupkg/Tern.Cli$suffix.$VERSION.nupkg"
            [ -f "$f" ] || { echo "::error::Missing $f"; missing=1; }
          done
          ls -l artifacts/nupkg
          exit $missing

      # Installs the tool from the local folder the way a user would from nuget.org, so the
      # top-level package resolves its linux-x64 package, and runs it.
      - name: Install and run from the packages
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet tool install Tern.Cli --version "$VERSION" --tool-path tools/tern --add-source artifacts/nupkg
          tools/tern/tern --version

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error

  publish:
    needs: pack
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      - name: Sign in to nuget.org
        id: login
        # Pinned to a commit: this step is handed the nuget.org key, so a moved tag can't change it.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      # RID packages first: the top-level package is only installable once they exist.
      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          source=https://api.nuget.org/v3/index.json
          for f in nupkg/*.{win,linux,osx}-*.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" --source "$source" --skip-duplicate
          done
          for f in nupkg/Tern.Cli.[0-9]*.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" --source "$source" --skip-duplicate
          done

  # A GitHub Release for the tag, with notes generated from the commits since the last one and a
  # standalone binary for each RID. A manual run makes one only when asked, for a tag that already
  # exists (such as a release from before this job).
  github-release:
    needs: [version, pack, publish]
    # Runs after a publish, or without one on a manual run that only asks for the release.
    if: >-
      always() && needs.pack.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.publish.result)
      && (github.event_name == 'push' || inputs.github-release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --title "Tern ${TAG#v}" --generate-notes
          fi
